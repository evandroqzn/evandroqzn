name: generate animation

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Gera o gráfico de contribuição no tema Bomberman com novos nomes
      - name: generate-bomberman-game-from-github-contribution-grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/bomberman-contribution-v2.svg?game=bomberman
            dist/bomberman-contribution-dark-v2.svg?palette=github-dark&game=bomberman

      # Publica os arquivos na branch (igual)
      - name: push bomberman-contribution-v2.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
