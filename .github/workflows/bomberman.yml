name: generate animation

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
  # Action com os parâmetros explícitos para Bomberman
  - name: generate-bomberman-game-from-github-contribution-grid
    uses: Platane/snk@v3
    with:
      github_user_name: ${{ github.repository_owner }}
      outputs: |
        dist/bomberman-contribution-graph.svg?game=bomberman
        dist/bomberman-contribution-graph-dark.svg?palette=github-dark&game=bomberman

  # Envia os arquivos gerados (igual)
  - name: push bomberman-contribution-graph.svg to the output branch
    uses: crazy-max/ghaction-github-pages@v3.1.0

      # Envia os arquivos gerados para a branch pacman-output
      - name: push bomberman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
