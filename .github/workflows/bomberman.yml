name: generate animation

on:
  # Executa automaticamente a cada 24 horas
  schedule:
    - cron: "0 */24 * * *"
  
  # Permite disparar manualmente na aba Actions
  workflow_dispatch:
  
  # Executa a cada push feito na branch main
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write # Permissão necessária para criar e atualizar a branch pacman-output
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Gera o gráfico de contribuição no tema Bomberman
      - name: generate-bomberman-game-from-github-contribution-grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/bomberman-contribution-graph.svg?game=bomberman
            dist/bomberman-contribution-graph-dark.svg?palette=github-dark&game=bomberman

      # Publica os arquivos SVG na branch pacman-output
      - name: push bomberman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
